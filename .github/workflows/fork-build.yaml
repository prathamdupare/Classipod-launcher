name: Build Debug APK

on:
  push:
    branches-ignore:
      - gh-pages
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  build_apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure repo
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Analyze
        run: dart analyze --no-fatal-warnings

      - name: Run tests
        run: flutter test --no-pub

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Split per ABI so the artifact is a third of the size; your phone needs
      # the arm64-v8a one.
      - name: Build debug APK
        run: flutter build apk --debug --flavor dev --split-per-abi

      # The SHA is in the name so a stale download is obvious at a glance.
      - uses: actions/upload-artifact@v4
        with:
          name: classipod-debug-apk-${{ steps.vars.outputs.sha_short }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      # Runs after the upload so a formatting nit still leaves a usable APK.
      - name: Check formatting
        run: |
          dart format lib/ test/
          git --no-pager diff --exit-code
